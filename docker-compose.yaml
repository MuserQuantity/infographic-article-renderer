services:
  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_USE_ANTV_INFOGRAPHIC=${VITE_USE_ANTV_INFOGRAPHIC:-false}
    container_name: infographic-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - backend

  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infographic-backend
    restart: unless-stopped
    networks:
      - app-network
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-gpt-4o-mini}
      - LLM_FORMATTER_MODEL_NAME=${LLM_FORMATTER_MODEL_NAME:-}
      - LLM_DUAL_MODEL_ENABLED=${LLM_DUAL_MODEL_ENABLED:-true}
      - LLM_DUAL_MODEL_THRESHOLD=${LLM_DUAL_MODEL_THRESHOLD:-15000}
      - CRAWL4AI_URL=${CRAWL4AI_URL}
      - POCKETBASE_URL=${POCKETBASE_URL}
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD}
      - DIFY_BASE_URL=${DIFY_BASE_URL:-https://api.dify.ai}
      - DIFY_API_KEY=${DIFY_API_KEY}
      - DIFY_USER=${DIFY_USER:-infographic}
      - DEBUG=false

networks:
  app-network:
    driver: bridge
