<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infographic Renderer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0c0a09;
      --panel: #1c1917;
      --panel-border: #292524;
      --panel-strong: #44403c;
      --text: #f5f5f4;
      --muted: #a8a29e;
      --muted-strong: #78716c;
      --brand-from: #6366f1;
      --brand-to: #9333ea;
      --action-from: #4f46e5;
      --action-to: #9333ea;
      --action-glow: rgba(79, 70, 229, 0.25);
      --success: #34d399;
      --error: #f87171;
    }

    body {
      font-family: "Noto Sans SC", "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--panel-border);
    }

    .logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--brand-from), var(--brand-to));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px var(--action-glow);
    }

    .logo svg {
      width: 18px;
      height: 18px;
      fill: white;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: #a8a29e;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: auto;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      color: #e7e5e4;
      background: #292524;
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
    }

    .current-url {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--muted);
      word-break: break-all;
      max-height: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--action-from), var(--action-to));
      color: white;
      box-shadow: 0 12px 24px var(--action-glow);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(79, 70, 229, 0.32);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      margin-top: 10px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--panel-strong);
    }

    .btn-secondary:hover {
      background: #292524;
    }

    .btn svg {
      width: 16px;
      height: 16px;
    }

    .settings {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--panel-border);
    }

    .settings-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 8px 10px;
      color: var(--muted);
      font-size: 12px;
      border-radius: 10px;
      transition: color 0.2s, background-color 0.2s;
    }

    .settings-toggle:hover {
      color: var(--text);
      background: #1c1917;
    }

    .settings-toggle svg {
      width: 14px;
      height: 14px;
      transition: transform 0.2s;
    }

    .settings-toggle.open svg {
      transform: rotate(180deg);
    }

    .settings-content {
      display: none;
      padding-top: 12px;
    }

    .settings-content.open {
      display: block;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
      border-color: var(--action-from);
      box-shadow: 0 0 0 1px rgba(79, 70, 229, 0.4);
    }

    .form-input::placeholder {
      color: var(--muted-strong);
    }

    .btn-save {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--panel-strong);
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 10px;
    }

    .btn-save:hover {
      background: #292524;
    }

    .saved-msg {
      color: var(--success);
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }

    .saved-msg.show {
      display: block;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--action-from);
    }

    .checkbox-group label {
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
    }

    .status {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      min-height: 16px;
    }

    .status.error {
      color: var(--error);
    }

    .status.success {
      color: var(--success);
    }

    /* 确认对话框样式 */
    .confirm-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .confirm-overlay.show {
      display: flex;
    }

    .confirm-dialog {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      max-height: 90vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .confirm-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--panel-border);
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .confirm-body {
      padding: 16px 20px;
      overflow-y: auto;
      flex: 1;
      /* 隐藏滚动条但保持滚动功能 */
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE/Edge */
    }

    .confirm-body::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }

    .confirm-info {
      font-size: 13px;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .confirm-info strong {
      color: var(--text);
      display: inline-block;
      min-width: 60px;
    }

    .confirm-subtitle-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--panel-border);
    }

    .confirm-subtitle-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      font-size: 13px;
      color: var(--text);
      transition: background 0.2s;
    }

    .confirm-subtitle-toggle:hover {
      background: #1c1917;
    }

    .confirm-subtitle-toggle svg {
      width: 16px;
      height: 16px;
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    .confirm-subtitle-toggle.open svg {
      transform: rotate(180deg);
    }

    .confirm-subtitle-content {
      display: none;
      margin-top: 10px;
    }

    .confirm-subtitle-content.show {
      display: block;
    }

    .confirm-subtitle-textarea {
      width: 100%;
      height: 200px;
      padding: 12px;
      background: var(--bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      color: var(--text);
      font-size: 12px;
      font-family: "Noto Sans SC", monospace;
      resize: vertical;
      line-height: 1.5;
      outline: none;
      /* 隐藏滚动条但保持滚动功能 */
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE/Edge */
    }

    .confirm-subtitle-textarea::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }

    .confirm-subtitle-textarea:focus {
      border-color: var(--action-from);
      box-shadow: 0 0 0 1px rgba(79, 70, 229, 0.4);
    }

    .confirm-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--panel-border);
      display: flex;
      gap: 10px;
    }

    .confirm-btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .confirm-btn-cancel {
      background: var(--panel-strong);
      color: var(--text);
    }

    .confirm-btn-cancel:hover {
      background: #57534e;
    }

    .confirm-btn-confirm {
      background: linear-gradient(135deg, var(--action-from), var(--action-to));
      color: white;
      box-shadow: 0 4px 12px var(--action-glow);
    }

    .confirm-btn-confirm:hover {
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 3l1.5 4.5H18l-3.5 2.5 1.5 4.5L12 12l-4 2.5 1.5-4.5L6 7.5h4.5L12 3z"/>
      </svg>
    </div>
    <div class="title">Infographic Analyzer</div>
    <button id="serverLinkBtn" class="icon-btn" aria-label="Open Server Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </button>
  </div>

  <div class="current-url" id="currentUrl">加载中...</div>

  <div class="checkbox-group">
    <input type="checkbox" id="translateCheck" checked>
    <label for="translateCheck">翻译为中文</label>
  </div>

  <button class="btn btn-primary" id="analyzeBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 3l1.5 4.5H18l-3.5 2.5 1.5 4.5L12 12l-4 2.5 1.5-4.5L6 7.5h4.5L12 3z"/>
    </svg>
    生成此页面信息图
  </button>

  <button class="btn btn-secondary" id="articlesBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M4 6h16M4 12h16M4 18h10"/>
    </svg>
    浏览文章库
  </button>

  <div class="status" id="statusMsg"></div>

  <div class="settings">
    <div class="settings-toggle" id="settingsToggle">
      <span>设置</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 9l6 6 6-6"/>
      </svg>
    </div>
    <div class="settings-content" id="settingsContent">
      <div class="form-group">
        <label class="form-label">服务域名</label>
        <input type="text" class="form-input" id="serverUrl" placeholder="https://your-domain.com">
      </div>
      <button class="btn btn-save" id="saveBtn">保存设置</button>
      <div class="saved-msg" id="savedMsg">设置已保存</div>
    </div>
  </div>

  <!-- 确认对话框 -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-dialog">
      <div class="confirm-header" id="confirmHeader">确认分析</div>
      <div class="confirm-body" id="confirmBody">
        <!-- 动态内容将在这里插入 -->
      </div>
      <div class="confirm-footer">
        <button class="confirm-btn confirm-btn-cancel" id="confirmCancel">取消</button>
        <button class="confirm-btn confirm-btn-confirm" id="confirmOk">确认分析</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
